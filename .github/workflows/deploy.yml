name: Portfolio CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Check react-router-dom
      - name: Check dependencies
        run: |
          npm ls react-router-dom
          test -d node_modules/react-router-dom
          echo "react-router-dom is installed"

      # 5. Run tests
      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      # 6. Build React project
      - name: Build project
        run: npm run build

      # 7. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # 8. Deploy build to VPS
      - name: Deploy build to VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -rf /var/www/portfolio/build && mkdir -p /var/www/portfolio/build"

          scp -r build/* \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio/build/"
